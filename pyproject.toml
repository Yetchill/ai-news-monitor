[project]
name = "ai-intelligence-monitor"
version = "0.1.0"
description = "Local AI industry intelligence monitor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "dateparser>=1.2,<2.0",
    "feedparser>=6.0,<7.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "lxml>=5.0,<7.0",
    "openpyxl>=3.1,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "python-docx>=1.1,<2.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "tenacity>=9.0,<10.0",
    "tzlocal>=5.0,<6.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.12,<1.0",
    "types-pyyaml>=6.0,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers -m 'not network'"
markers = [
    "network: live public-network integration tests (excluded from normal unit-test runs)",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["app", "tests"]
exclude = ["app/storage/migrations/versions"]
venvPath = "."
venv = ".venv"
